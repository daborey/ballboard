<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>App Mode With Rename Fixed</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }

  /* START SCREEN */
  #start {
    position: fixed;
    inset: 0;
    background: black;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;
    z-index: 99999;
  }

  /* MAIN */
  #container {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: black;
  }

  /* IMAGE NO CROP */
  #bg {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* BUTTONS */
  .dragBtn {
    position: absolute;
    z-index: 10;

    width: clamp(45px, 6vw, 80px);
    height: clamp(45px, 6vw, 80px);

    border-radius: 50%;
    border: none;

    background: #4CAF50;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    user-select: none;
    touch-action: none;
  }

  .dragBtn span {
    outline: none;
  }

  .editing {
    background: orange !important;
  }

  /* fullscreen button */
  #fsBtn {
    position: fixed;
    right: 15px;
    bottom: 15px;

    width: 55px;
    height: 55px;

    border-radius: 50%;
    border: none;

    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 20px;

    z-index: 99999;
  }
</style>
</head>

<body>

<div id="start">Tap to Start</div>

<div id="container">

  <img id="bg" src="bg.jpg">

  <!-- BUTTONS (WITH TEXT SPANS FOR RENAME) -->
  <button class="dragBtn" style="top:10%; left:10%;"><span>1</span></button>
  <button class="dragBtn" style="top:10%; left:20%;"><span>2</span></button>
  <button class="dragBtn" style="top:20%; left:10%;"><span>3</span></button>
  <button class="dragBtn" style="top:20%; left:20%;"><span>4</span></button>
  <button class="dragBtn" style="top:30%; left:10%;"><span>5</span></button>
  <button class="dragBtn" style="top:30%; left:20%;"><span>6</span></button>
  <button class="dragBtn" style="top:40%; left:10%;"><span>7</span></button>
  <button class="dragBtn" style="top:40%; left:20%;"><span>8</span></button>
  <button class="dragBtn" style="top:50%; left:10%;"><span>9</span></button>
  <button class="dragBtn" style="top:50%; left:20%;"><span>10</span></button>
  <button class="dragBtn" style="top:60%; left:10%;"><span>11</span></button>

</div>

<button id="fsBtn">⛶</button>

<script>
const start = document.getElementById("start");
const buttons = document.querySelectorAll(".dragBtn");

/* ================= START ================= */
start.addEventListener("click", () => {

  start.style.display = "none";

  const fs = document.documentElement.requestFullscreen?.();

  if (fs && fs.then) {
    fs.then(() => {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(()=>{});
      }
    }).catch(()=>{});
  }
});

/* ================= FULLSCREEN BUTTON ================= */
document.getElementById("fsBtn").addEventListener("click", () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});

/* ================= DRAG + RENAME ================= */
buttons.forEach(btn => {
  const text = btn.querySelector("span");

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  /* ===== DRAG START ===== */
  btn.addEventListener("mousedown", startDrag);
  btn.addEventListener("touchstart", startDrag, {passive:false});

  function startDrag(e) {
    if (btn.classList.contains("editing")) return;

    dragging = true;

    const p = e.touches ? e.touches[0] : e;
    const r = btn.getBoundingClientRect();

    offsetX = p.clientX - r.left;
    offsetY = p.clientY - r.top;

    e.preventDefault();
  }

  /* ===== MOVE ===== */
  document.addEventListener("mousemove", move);
  document.addEventListener("touchmove", move, {passive:false});

  function move(e) {
    if (!dragging) return;

    const p = e.touches ? e.touches[0] : e;
    const r = document.getElementById("container").getBoundingClientRect();

    let x = p.clientX - r.left - offsetX;
    let y = p.clientY - r.top - offsetY;

    btn.style.left = (x / r.width) * 100 + "%";
    btn.style.top = (y / r.height) * 100 + "%";

    e.preventDefault();
  }

  document.addEventListener("mouseup", stop);
  document.addEventListener("touchend", stop);

  function stop() {
    dragging = false;
  }

  /* ================= RENAME (FIXED) ================= */
  function enableEdit() {
    btn.classList.add("editing");
    text.contentEditable = "true";
    text.focus();

    // move cursor to end
    const range = document.createRange();
    range.selectNodeContents(text);
    range.collapse(false);

    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function disableEdit() {
    btn.classList.remove("editing");
    text.contentEditable = "false";
  }

  btn.addEventListener("dblclick", enableEdit);

  document.addEventListener("click", (e) => {
    if (!btn.contains(e.target)) {
      disableEdit();
    }
  });
});
</script>

</body>
</html>
