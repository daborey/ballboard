<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auto Fullscreen App Mode</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }

  /* ===== START SCREEN ===== */
  #startScreen {
    position: fixed;
    inset: 0;
    background: black;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;
    z-index: 99999;
  }

  /* ===== MAIN ===== */
  #container {
    width: 100vw;
    height: 100vh;
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    background: black;
  }

  /* image always no crop */
  #container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* hide UI in fullscreen clean mode */
  #container.clean .dragBtn {
    opacity: 0;
    pointer-events: none;
  }

  /* ===== BUTTONS ===== */
  .dragBtn {
    position: absolute;

    width: clamp(45px, 6vw, 80px);
    height: clamp(45px, 6vw, 80px);

    border-radius: 50%;
    border: none;

    background: #4CAF50;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    touch-action: none;
  }

  .dragBtn span {
    outline: none;
  }

  .editing {
    background: orange !important;
  }

</style>
</head>

<body>

<!-- START SCREEN -->
<div id="startScreen">Tap to Start</div>

<div id="container">

  <img src="bg.jpg">

  <!-- buttons -->
  <button class="dragBtn" style="top:10%; left:10%;"><span>1</span></button>
  <button class="dragBtn" style="top:10%; left:20%;"><span>2</span></button>
  <button class="dragBtn" style="top:20%; left:10%;"><span>3</span></button>
  <button class="dragBtn" style="top:20%; left:20%;"><span>4</span></button>
  <button class="dragBtn" style="top:30%; left:10%;"><span>5</span></button>
  <button class="dragBtn" style="top:30%; left:20%;"><span>6</span></button>
  <button class="dragBtn" style="top:40%; left:10%;"><span>7</span></button>
  <button class="dragBtn" style="top:40%; left:20%;"><span>8</span></button>
  <button class="dragBtn" style="top:50%; left:10%;"><span>9</span></button>
  <button class="dragBtn" style="top:50%; left:20%;"><span>10</span></button>
  <button class="dragBtn" style="top:60%; left:10%;"><span>11</span></button>

</div>

<script>
const startScreen = document.getElementById("startScreen");
const container = document.getElementById("container");
const buttons = document.querySelectorAll(".dragBtn");

/* ===== START APP (USER TAP REQUIRED) ===== */
startScreen.addEventListener("click", async () => {
  startScreen.style.display = "none";

  try {
    await document.documentElement.requestFullscreen();

    // lock landscape (Android only)
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock("landscape");
    }

    // hide UI like YouTube clean mode
    container.classList.add("clean");

  } catch (e) {
    console.log(e);
  }
});

/* ===== DRAG ===== */
buttons.forEach(btn => {
  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  function start(x, y, e) {
    dragging = true;

    const r = btn.getBoundingClientRect();
    offsetX = x - r.left;
    offsetY = y - r.top;

    if (e) e.preventDefault();
  }

  function move(x, y) {
    if (!dragging) return;

    const r = container.getBoundingClientRect();

    let px = x - r.left - offsetX;
    let py = y - r.top - offsetY;

    btn.style.left = (px / r.width) * 100 + "%";
    btn.style.top = (py / r.height) * 100 + "%";
  }

  function stop() {
    dragging = false;
  }

  btn.addEventListener("mousedown", e => start(e.clientX, e.clientY, e));
  document.addEventListener("mousemove", e => move(e.clientX, e.clientY));
  document.addEventListener("mouseup", stop);

  btn.addEventListener("touchstart", e => {
    const t = e.touches[0];
    start(t.clientX, t.clientY, e);
  }, { passive: false });

  document.addEventListener("touchmove", e => {
    const t = e.touches[0];
    move(t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener("touchend", stop);
});
</script>

</body>
</html>
