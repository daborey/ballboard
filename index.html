<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stable Mobile Buttons</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    overflow: hidden;
    background: black;
    touch-action: none;
  }

  #container {
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  #bg {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .btn {
    position: absolute;
    z-index: 10;

    width: 60px;
    height: 60px;

    border-radius: 50%;
    border: none;

    background: #4CAF50;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    user-select: none;
    touch-action: none;
  }

  .btn span {
    outline: none;
  }

  .editing {
    background: orange !important;
  }

  #start {
    position: fixed;
    inset: 0;
    background: black;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
    z-index: 99999;
  }
</style>
</head>

<body>

<div id="start">Tap to Start</div>

<div id="container">

  <img id="bg" src="bg.jpg">

  <button class="btn" style="top:10%; left:10%;"><span>1</span></button>
  <button class="btn" style="top:10%; left:20%;"><span>2</span></button>
  <button class="btn" style="top:20%; left:10%;"><span>3</span></button>
  <button class="btn" style="top:20%; left:20%;"><span>4</span></button>
  <button class="btn" style="top:30%; left:10%;"><span>5</span></button>
  <button class="btn" style="top:30%; left:20%;"><span>6</span></button>
  <button class="btn" style="top:40%; left:10%;"><span>7</span></button>
  <button class="btn" style="top:40%; left:20%;"><span>8</span></button>
  <button class="btn" style="top:50%; left:10%;"><span>9</span></button>
  <button class="btn" style="top:50%; left:20%;"><span>10</span></button>
  <button class="btn" style="top:60%; left:10%;"><span>11</span></button>

</div>

<script>
const start = document.getElementById("start");
const buttons = document.querySelectorAll(".btn");

/* ================= START ================= */
start.addEventListener("click", () => {
  start.style.display = "none";

  document.documentElement.requestFullscreen?.();

  if (screen.orientation?.lock) {
    screen.orientation.lock("landscape").catch(()=>{});
  }
});

/* ================= DRAG ================= */
buttons.forEach(btn => {
  const text = btn.querySelector("span");

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  btn.addEventListener("touchstart", startDrag, {passive:false});
  btn.addEventListener("mousedown", startDrag);

  function startDrag(e) {
    if (btn.classList.contains("editing")) return;

    const p = e.touches ? e.touches[0] : e;
    const r = btn.getBoundingClientRect();

    offsetX = p.clientX - r.left;
    offsetY = p.clientY - r.top;

    dragging = true;
    e.preventDefault();
  }

  document.addEventListener("touchmove", move, {passive:false});
  document.addEventListener("mousemove", move);

  function move(e) {
    if (!dragging) return;

    const p = e.touches ? e.touches[0] : e;
    const r = document.getElementById("container").getBoundingClientRect();

    let x = p.clientX - r.left - offsetX;
    let y = p.clientY - r.top - offsetY;

    btn.style.left = (x / r.width) * 100 + "%";
    btn.style.top = (y / r.height) * 100 + "%";

    e.preventDefault();
  }

  document.addEventListener("touchend", stop);
  document.addEventListener("mouseup", stop);

  function stop() {
    dragging = false;
  }

  /* ================= MOBILE SAFE RENAME ================= */
  let lastTap = 0;

  btn.addEventListener("click", () => {
    const now = Date.now();

    if (now - lastTap < 400) {
      enableEdit();
    }

    lastTap = now;
  });

  function enableEdit() {
    btn.classList.add("editing");
    text.contentEditable = "true";
    text.focus();

    const range = document.createRange();
    range.selectNodeContents(text);
    range.collapse(false);

    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  document.addEventListener("click", (e) => {
    if (!btn.contains(e.target)) {
      btn.classList.remove("editing");
      text.contentEditable = "false";
    }
  });

});
</script>

</body>
</html>
