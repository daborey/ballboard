<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fixed Scale App</title>

<style>
html,body{
 margin:0;
 overflow:hidden;
 background:black;
}

/* FULLSCREEN BUTTON */
#fsBtn{
 position:fixed;
 right:15px;
 bottom:15px;
 width:55px;
 height:55px;
 border-radius:50%;
 border:none;
 background:#0008;
 color:white;
 z-index:9999;
}

/* CONTAINER */
#c{
 position:relative;
 width:100vw;
 transform-origin:top left;
}

/* IMAGE */
#bg{
 width:100%;
 height:100%;
 object-fit:contain;
 background:black;
}

/* BUTTONS */
.b{
 position:absolute;
 width:80px;
 height:80px;

 border-radius:50%;
 border:0;
 background:#4caf50;
 color:white;

 display:flex;
 justify-content:center;
 align-items:center;

 user-select:none;
 touch-action:none;
}

.b span{
 outline:none;
 font-size:20px;
}

.edit{background:orange!important}
</style>
</head>

<body>

<button id="fsBtn">⛶</button>

<div id="c">

<img id="bg" src="bg.jpg">

<button class="b" style="top:10%;left:10%"><span>1</span></button>
<button class="b" style="top:10%;left:20%"><span>2</span></button>
<button class="b" style="top:20%;left:10%"><span>3</span></button>
<button class="b" style="top:20%;left:20%"><span>4</span></button>
<button class="b" style="top:30%;left:10%"><span>5</span></button>
<button class="b" style="top:30%;left:20%"><span>6</span></button>
<button class="b" style="top:40%;left:10%"><span>7</span></button>
<button class="b" style="top:40%;left:20%"><span>8</span></button>
<button class="b" style="top:50%;left:10%"><span>9</span></button>
<button class="b" style="top:50%;left:20%"><span>10</span></button>
<button class="b" style="top:60%;left:10%"><span>11</span></button>

</div>

<script>

/* ===== FIX HEIGHT ===== */
function setHeight(){
 c.style.height = window.innerHeight + "px"
}
setHeight()

/* ===== APPLY SCALE ONCE (ONLY BEFORE FULLSCREEN) ===== */
c.style.transform = "scale(1.15)"   // 👈 adjust if needed (1.1 ~ 1.2)

/* ===== FULLSCREEN (NO SCALE CHANGE) ===== */
fsBtn.onclick=async()=>{
 if(!document.fullscreenElement)
  document.documentElement.requestFullscreen()
 else
  document.exitFullscreen()
}

/* ===== DRAG ===== */
document.querySelectorAll(".b").forEach(b=>{

let active=false,ox=0,oy=0
const t=b.querySelector("span")

b.addEventListener("pointerdown",(e)=>{
 if(b.classList.contains("edit"))return

 const r=b.getBoundingClientRect()
 const cRect=c.getBoundingClientRect()

 ox=e.clientX-r.left
 oy=e.clientY-r.top

 active=true
 b.setPointerCapture(e.pointerId)
})

b.addEventListener("pointermove",(e)=>{
 if(!active)return

 const cRect=c.getBoundingClientRect()

 let x=e.clientX-cRect.left-ox
 let y=e.clientY-cRect.top-oy

 b.style.left=(x/cRect.width)*100+"%"
 b.style.top=(y/cRect.height)*100+"%"
})

b.addEventListener("pointerup",()=>active=false)

/* EDIT */
let last=0
b.onclick=()=>{
let now=Date.now()

if(now-last<300){
 b.classList.add("edit")
 t.contentEditable=true
 t.focus()

 let range=document.createRange()
 range.selectNodeContents(t)
 range.collapse(false)

 let sel=window.getSelection()
 sel.removeAllRanges()
 sel.addRange(range)
}

last=now
}

/* EXIT EDIT */
document.addEventListener("click",e=>{
if(!b.contains(e.target)){
 b.classList.remove("edit")
 t.contentEditable=false
}
})

})

</script>

</body>
</html>
