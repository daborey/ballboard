<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mobile Fixed Drag UI</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
  }

  /* ===== BACKGROUND ===== */
  #container {
    width: 100vw;
    height: 100vh;
    position: relative;

    background-image: url("bg.jpg");
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-color: black;
  }

  /* ===== BUTTONS ===== */
  .dragBtn {
    position: absolute;

    width: clamp(50px, 10vw, 80px);
    height: clamp(50px, 10vw, 80px);

    border-radius: 50%;
    border: none;

    background: #4CAF50;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    user-select: none;

    font-size: clamp(12px, 3vw, 16px);

    /* IMPORTANT FOR MOBILE */
    touch-action: none;
  }

  .dragBtn span {
    outline: none;
  }

  .editing {
    background: orange !important;
  }

  /* ===== FS BUTTON ===== */
  #fsBtn {
    position: fixed;
    right: 15px;
    bottom: 15px;

    width: 55px;
    height: 55px;

    border-radius: 50%;
    border: none;

    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 20px;

    z-index: 9999;
  }
</style>
</head>

<body>

<div id="container">

  <button class="dragBtn" style="top:10%; left:10%;"><span contenteditable="false">1</span></button>
  <button class="dragBtn" style="top:10%; left:25%;"><span contenteditable="false">2</span></button>
  <button class="dragBtn" style="top:20%; left:10%;"><span contenteditable="false">3</span></button>
  <button class="dragBtn" style="top:20%; left:25%;"><span contenteditable="false">4</span></button>
  <button class="dragBtn" style="top:30%; left:10%;"><span contenteditable="false">5</span></button>

</div>

<button id="fsBtn">⛶</button>

<script>
const container = document.getElementById("container");
const buttons = document.querySelectorAll(".dragBtn");
const fsBtn = document.getElementById("fsBtn");

/* ================= FULLSCREEN (MOBILE SAFE) ================= */
async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (e) {
    console.log(e);
  }
}

fsBtn.addEventListener("click", toggleFullscreen);

/* ================= DRAG (POINTER EVENTS FIX) ================= */
buttons.forEach(btn => {
  const text = btn.querySelector("span");

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  function start(e) {
    if (btn.classList.contains("editing")) return;

    dragging = true;

    const rect = btn.getBoundingClientRect();

    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    e.preventDefault();
  }

  function move(e) {
    if (!dragging) return;

    const rect = container.getBoundingClientRect();

    let x = e.clientX - rect.left - offsetX;
    let y = e.clientY - rect.top - offsetY;

    btn.style.left = (x / rect.width) * 100 + "%";
    btn.style.top = (y / rect.height) * 100 + "%";
  }

  function end() {
    dragging = false;
  }

  /* POINTER EVENTS (WORKS ON ALL DEVICES) */
  btn.addEventListener("pointerdown", start);
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", end);

  /* ================= EDIT ================= */
  function edit() {
    btn.classList.add("editing");
    text.contentEditable = "true";
    text.focus();

    const range = document.createRange();
    const sel = window.getSelection();

    range.selectNodeContents(text);
    range.collapse(false);

    sel.removeAllRanges();
    sel.addRange(range);
  }

  function stopEdit() {
    btn.classList.remove("editing");
    text.contentEditable = "false";
  }

  btn.addEventListener("dblclick", edit);

  document.addEventListener("click", e => {
    if (!btn.contains(e.target)) stopEdit();
  });
});
</script>

</body>
</html>
