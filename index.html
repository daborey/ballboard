<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fixed Full UI</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
  }

  /* ===== BACKGROUND ===== */
  #container {
    width: 100vw;
    height: 100vh;
    position: relative;

    background-image: url("bg.jpg");
    background-size: contain;   /* NO CROP */
    background-position: center;
    background-repeat: no-repeat;
    background-color: black;
  }

  /* fullscreen visual mode */
  #container.fs {
    transform: scale(1.02);
  }

  /* ===== BUTTONS ===== */
  .dragBtn {
    position: absolute;

    width: clamp(45px, 6vw, 80px);
    height: clamp(45px, 6vw, 80px);

    border-radius: 50%;
    border: none;

    background: #4CAF50;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    user-select: none;
    cursor: grab;

    font-size: clamp(10px, 1.2vw, 16px);

    touch-action: none;
  }

  .dragBtn span {
    outline: none;
  }

  .editing {
    background: orange !important;
    cursor: text;
  }

  /* fullscreen button */
  #fsBtn {
    position: fixed;
    right: 15px;
    bottom: 15px;

    width: 50px;
    height: 50px;

    border-radius: 50%;
    border: none;

    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 20px;

    z-index: 9999;
  }
</style>
</head>

<body>

<div id="container">

  <!-- buttons -->
  <button class="dragBtn" style="top:10%; left:10%;"><span contenteditable="false">1</span></button>
  <button class="dragBtn" style="top:10%; left:20%;"><span contenteditable="false">2</span></button>
  <button class="dragBtn" style="top:10%; left:30%;"><span contenteditable="false">3</span></button>
  <button class="dragBtn" style="top:20%; left:10%;"><span contenteditable="false">4</span></button>
  <button class="dragBtn" style="top:20%; left:20%;"><span contenteditable="false">5</span></button>
  <button class="dragBtn" style="top:20%; left:30%;"><span contenteditable="false">6</span></button>
  <button class="dragBtn" style="top:30%; left:10%;"><span contenteditable="false">7</span></button>
  <button class="dragBtn" style="top:30%; left:20%;"><span contenteditable="false">8</span></button>
  <button class="dragBtn" style="top:30%; left:30%;"><span contenteditable="false">9</span></button>
  <button class="dragBtn" style="top:40%; left:10%;"><span contenteditable="false">10</span></button>
  <button class="dragBtn" style="top:40%; left:20%;"><span contenteditable="false">11</span></button>

</div>

<button id="fsBtn">⛶</button>

<script>
const container = document.getElementById("container");
const buttons = document.querySelectorAll(".dragBtn");
const fsBtn = document.getElementById("fsBtn");

/* ================= FULLSCREEN FIXED ================= */
function isFS() {
  return document.fullscreenElement;
}

async function toggleFS() {
  try {
    if (!isFS()) {
      await document.documentElement.requestFullscreen();
      container.classList.add("fs");
    } else {
      await document.exitFullscreen();
      container.classList.remove("fs");
    }
  } catch (e) {
    console.log("Fullscreen error:", e);
  }
}

fsBtn.addEventListener("click", toggleFS);

/* ================= DRAG ================= */
buttons.forEach(btn => {
  const text = btn.querySelector("span");

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  function start(x, y, e) {
    if (btn.classList.contains("editing")) return;

    dragging = true;
    const r = btn.getBoundingClientRect();

    offsetX = x - r.left;
    offsetY = y - r.top;

    if (e) e.preventDefault();
  }

  function move(x, y) {
    if (!dragging) return;

    const r = container.getBoundingClientRect();

    let px = x - r.left - offsetX;
    let py = y - r.top - offsetY;

    btn.style.left = (px / r.width) * 100 + "%";
    btn.style.top = (py / r.height) * 100 + "%";
  }

  function stop() {
    dragging = false;
  }

  // mouse
  btn.addEventListener("mousedown", e => start(e.clientX, e.clientY, e));
  document.addEventListener("mousemove", e => move(e.clientX, e.clientY));
  document.addEventListener("mouseup", stop);

  // touch
  btn.addEventListener("touchstart", e => {
    const t = e.touches[0];
    start(t.clientX, t.clientY, e);
  }, { passive: false });

  document.addEventListener("touchmove", e => {
    const t = e.touches[0];
    move(t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener("touchend", stop);

  /* ================= EDIT ================= */
  function edit() {
    btn.classList.add("editing");
    text.contentEditable = "true";
    text.focus();

    const range = document.createRange();
    const sel = window.getSelection();

    range.selectNodeContents(text);
    range.collapse(false);

    sel.removeAllRanges();
    sel.addRange(range);
  }

  function exitEdit() {
    btn.classList.remove("editing");
    text.contentEditable = "false";
  }

  btn.addEventListener("dblclick", e => {
    edit();
    e.stopPropagation();
  });

  let lastTap = 0;
  btn.addEventListener("touchend", e => {
    let now = Date.now();
    if (now - lastTap < 300) {
      edit();
      e.preventDefault();
    }
    lastTap = now;
  });

  document.addEventListener("click", e => {
    if (!btn.contains(e.target)) exitEdit();
  });
});
</script>

</body>
</html>
