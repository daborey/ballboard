<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mobile Drag Fix UI</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
  }

  /* ===== BACKGROUND ===== */
  #container {
    width: 100vw;
    height: 100vh;
    position: relative;

    background-image: url("bg.jpg"); /* 👈 your image */
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-color: black;
  }

  /* ===== BUTTONS ===== */
  .dragBtn {
    position: absolute;

    width: clamp(45px, 6vw, 80px);
    height: clamp(45px, 6vw, 80px);

    border-radius: 50%;
    border: none;

    background: #4CAF50;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: grab;
    user-select: none;

    font-size: clamp(10px, 1.2vw, 16px);

    /* 🔥 IMPORTANT for mobile drag */
    touch-action: none;
  }

  .dragBtn span {
    outline: none;
  }

  .editing {
    background: orange !important;
    cursor: text;
  }

  /* ===== FULLSCREEN BUTTON ===== */
  #fsBtn {
    position: fixed;
    right: 15px;
    bottom: 15px;

    width: 50px;
    height: 50px;

    border-radius: 50%;
    border: none;

    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 20px;

    cursor: pointer;
    z-index: 9999;
  }
</style>
</head>

<body>

<div id="container">

  <!-- 11 buttons -->
  <button class="dragBtn" style="top:10%; left:5%;"><span contenteditable="false">1</span></button>
  <button class="dragBtn" style="top:10%; left:15%;"><span contenteditable="false">2</span></button>
  <button class="dragBtn" style="top:10%; left:25%;"><span contenteditable="false">3</span></button>
  <button class="dragBtn" style="top:10%; left:35%;"><span contenteditable="false">4</span></button>
  <button class="dragBtn" style="top:10%; left:45%;"><span contenteditable="false">5</span></button>

  <button class="dragBtn" style="top:20%; left:5%;"><span contenteditable="false">6</span></button>
  <button class="dragBtn" style="top:20%; left:15%;"><span contenteditable="false">7</span></button>
  <button class="dragBtn" style="top:20%; left:25%;"><span contenteditable="false">8</span></button>
  <button class="dragBtn" style="top:20%; left:35%;"><span contenteditable="false">9</span></button>
  <button class="dragBtn" style="top:20%; left:45%;"><span contenteditable="false">10</span></button>

  <button class="dragBtn" style="top:30%; left:5%;"><span contenteditable="false">11</span></button>

</div>

<!-- fullscreen button -->
<button id="fsBtn">⛶</button>

<script>
const container = document.getElementById("container");
const buttons = document.querySelectorAll(".dragBtn");
const fsBtn = document.getElementById("fsBtn");

/* ================= FULLSCREEN ================= */
function isFullScreen() {
  return document.fullscreenElement ||
         document.webkitFullscreenElement ||
         document.msFullscreenElement;
}

function enterFullScreen() {
  const elem = document.documentElement;

  if (elem.requestFullscreen) elem.requestFullscreen();
  else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
  else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
}

function exitFullScreen() {
  if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  else if (document.msExitFullscreen) document.msExitFullscreen();
}

fsBtn.addEventListener("click", () => {
  if (isFullScreen()) exitFullScreen();
  else enterFullScreen();
});

/* ================= DRAG (MOUSE + TOUCH FIXED) ================= */
buttons.forEach(btn => {
  const text = btn.querySelector("span");

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  function startDrag(x, y, e) {
    if (btn.classList.contains("editing")) return;

    dragging = true;

    const rect = btn.getBoundingClientRect();

    offsetX = x - rect.left;
    offsetY = y - rect.top;

    btn.style.cursor = "grabbing";

    if (e) e.preventDefault();
  }

  function move(x, y) {
    if (!dragging) return;

    const rect = container.getBoundingClientRect();

    let posX = x - rect.left - offsetX;
    let posY = y - rect.top - offsetY;

    let percentX = (posX / rect.width) * 100;
    let percentY = (posY / rect.height) * 100;

    btn.style.left = percentX + "%";
    btn.style.top = percentY + "%";
  }

  function stopDrag() {
    dragging = false;
    btn.style.cursor = "grab";
  }

  /* ===== MOUSE ===== */
  btn.addEventListener("mousedown", (e) => {
    startDrag(e.clientX, e.clientY, e);
  });

  document.addEventListener("mousemove", (e) => {
    move(e.clientX, e.clientY);
  });

  document.addEventListener("mouseup", stopDrag);

  /* ===== TOUCH ===== */
  btn.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    startDrag(t.clientX, t.clientY, e);
  }, { passive: false });

  document.addEventListener("touchmove", (e) => {
    const t = e.touches[0];
    move(t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener("touchend", stopDrag);

  /* ================= EDIT MODE ================= */
  function enableEdit() {
    btn.classList.add("editing");
    text.contentEditable = "true";
    text.focus();

    const range = document.createRange();
    const sel = window.getSelection();

    range.selectNodeContents(text);
    range.collapse(false);

    sel.removeAllRanges();
    sel.addRange(range);
  }

  function disableEdit() {
    btn.classList.remove("editing");
    text.contentEditable = "false";
  }

  btn.addEventListener("dblclick", (e) => {
    enableEdit();
    e.stopPropagation();
  });

  let lastTap = 0;
  btn.addEventListener("touchend", (e) => {
    let now = Date.now();
    if (now - lastTap < 300) {
      enableEdit();
      e.preventDefault();
    }
    lastTap = now;
  });

  document.addEventListener("click", (e) => {
    if (!btn.contains(e.target)) {
      disableEdit();
    }
  });

  btn.addEventListener("mousedown", (e) => {
    if (btn.classList.contains("editing")) {
      e.stopPropagation();
    }
  });
});
</script>

</body>
</html>
