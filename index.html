<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultimate Stable App</title>

<style>
html,body{
 margin:0;
 overflow:hidden;
 background:black;
}

/* FULLSCREEN BUTTON */
#fsBtn{
 position:fixed;
 right:15px;
 bottom:15px;
 width:55px;
 height:55px;
 border-radius:50%;
 border:none;
 background:#0008;
 color:white;
 z-index:9999;
}

/* CONTAINER */
#c{
 position:relative;
 width:100vw;
}

/* IMAGE */
#bg{
 width:100%;
 height:100%;
 object-fit:contain;
 background:black;
}

/* BUTTONS */
.b{
 position:absolute;
 width:clamp(40px,10vw,70px);
 height:clamp(40px,10vw,70px);

 border-radius:50%;
 border:0;
 background:#4caf50;
 color:white;

 display:flex;
 justify-content:center;
 align-items:center;

 user-select:none;
 touch-action:none;
}

.b span{outline:none}
.edit{background:orange!important}
</style>
</head>

<body>

<button id="fsBtn">⛶</button>

<div id="c">

<img id="bg" src="bg.jpg">

<button class="b" style="top:10%;left:10%"><span>1</span></button>
<button class="b" style="top:10%;left:20%"><span>2</span></button>
<button class="b" style="top:20%;left:10%"><span>3</span></button>
<button class="b" style="top:20%;left:20%"><span>4</span></button>
<button class="b" style="top:30%;left:10%"><span>5</span></button>
<button class="b" style="top:30%;left:20%"><span>6</span></button>
<button class="b" style="top:40%;left:10%"><span>7</span></button>
<button class="b" style="top:40%;left:20%"><span>8</span></button>
<button class="b" style="top:50%;left:10%"><span>9</span></button>
<button class="b" style="top:50%;left:20%"><span>10</span></button>
<button class="b" style="top:60%;left:10%"><span>11</span></button>

</div>

<script>

/* ===== FORCE REAL HEIGHT (KEY FIX) ===== */
function setHeight(){
 document.getElementById("c").style.height = window.innerHeight + "px"
}
setHeight()
window.addEventListener("resize", setHeight)

/* ===== FULLSCREEN ===== */
fsBtn.onclick=async()=>{
 if(!document.fullscreenElement)
  document.documentElement.requestFullscreen()
 else
  document.exitFullscreen()

 setTimeout(setHeight,300) // fix after fullscreen change
}

/* ===== POINTER DRAG ===== */
document.querySelectorAll(".b").forEach(b=>{

let active=false,ox=0,oy=0
const t=b.querySelector("span")

b.addEventListener("pointerdown",(e)=>{
 if(b.classList.contains("edit"))return

 const r=b.getBoundingClientRect()
 const c=document.getElementById("c").getBoundingClientRect()

 ox=e.clientX-r.left
 oy=e.clientY-r.top

 active=true
 b.setPointerCapture(e.pointerId)
})

b.addEventListener("pointermove",(e)=>{
 if(!active)return

 const c=document.getElementById("c").getBoundingClientRect()

 let x=e.clientX-c.left-ox
 let y=e.clientY-c.top-oy

 b.style.left=(x/c.width)*100+"%"
 b.style.top=(y/c.height)*100+"%"
})

b.addEventListener("pointerup",()=>active=false)

/* ===== DOUBLE TAP / CLICK EDIT ===== */
let last=0

b.onclick=()=>{
let now=Date.now()

if(now-last<300){
 b.classList.add("edit")
 t.contentEditable=true
 t.focus()

 let range=document.createRange()
 range.selectNodeContents(t)
 range.collapse(false)

 let sel=window.getSelection()
 sel.removeAllRanges()
 sel.addRange(range)
}

last=now
}

/* EXIT EDIT */
document.addEventListener("click",e=>{
if(!b.contains(e.target)){
 b.classList.remove("edit")
 t.contentEditable=false
}
})

})
</script>

</body>
</html>
