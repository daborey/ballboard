<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fullscreen + Rotate + No Crop UI</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }

  /* ===== MAIN SCREEN ===== */
  #container {
    width: 100vw;
    height: 100vh;
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    background: black;
  }

  /* ===== IMAGE (NO CROP EVER) ===== */
  #container img {
    width: 100%;
    height: 100%;

    object-fit: contain;
  }

  /* fullscreen feel */
  #container.fs img {
    transform: scale(1.02);
  }

  /* ===== BUTTONS ===== */
  .dragBtn {
    position: absolute;

    width: clamp(45px, 6vw, 80px);
    height: clamp(45px, 6vw, 80px);

    border-radius: 50%;
    border: none;

    background: #4CAF50;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    user-select: none;

    font-size: clamp(10px, 1.2vw, 16px);

    touch-action: none;
  }

  .dragBtn span {
    outline: none;
  }

  .editing {
    background: orange !important;
  }

  /* ===== FULLSCREEN BUTTON ===== */
  #fsBtn {
    position: fixed;
    right: 15px;
    bottom: 15px;

    width: 55px;
    height: 55px;

    border-radius: 50%;
    border: none;

    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 20px;

    z-index: 9999;
  }
</style>
</head>

<body>

<div id="container">

  <img src="bg.jpg">

  <!-- 11 BUTTONS -->
  <button class="dragBtn" style="top:10%; left:10%;"><span contenteditable="false">1</span></button>
  <button class="dragBtn" style="top:10%; left:20%;"><span contenteditable="false">2</span></button>
  <button class="dragBtn" style="top:20%; left:10%;"><span contenteditable="false">3</span></button>
  <button class="dragBtn" style="top:20%; left:20%;"><span contenteditable="false">4</span></button>
  <button class="dragBtn" style="top:30%; left:10%;"><span contenteditable="false">5</span></button>
  <button class="dragBtn" style="top:30%; left:20%;"><span contenteditable="false">6</span></button>
  <button class="dragBtn" style="top:40%; left:10%;"><span contenteditable="false">7</span></button>
  <button class="dragBtn" style="top:40%; left:20%;"><span contenteditable="false">8</span></button>
  <button class="dragBtn" style="top:50%; left:10%;"><span contenteditable="false">9</span></button>
  <button class="dragBtn" style="top:50%; left:20%;"><span contenteditable="false">10</span></button>
  <button class="dragBtn" style="top:60%; left:10%;"><span contenteditable="false">11</span></button>

</div>

<button id="fsBtn">⛶</button>

<script>
const container = document.getElementById("container");
const buttons = document.querySelectorAll(".dragBtn");
const fsBtn = document.getElementById("fsBtn");

/* ================= ROTATION ================= */
async function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock("landscape");
    }
  } catch (e) {
    console.log("Lock failed:", e);
  }
}

function unlockRotation() {
  try {
    if (screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock();
    }
  } catch (e) {}
}

/* ================= FULLSCREEN ================= */
async function toggleFS() {
  if (!document.fullscreenElement) {
    await document.documentElement.requestFullscreen();
    container.classList.add("fs");

    // 👉 force landscape
    lockLandscape();

  } else {
    await document.exitFullscreen();
    container.classList.remove("fs");

    // 👉 unlock rotation
    unlockRotation();
  }
}

fsBtn.addEventListener("click", toggleFS);

/* ================= DRAG ================= */
buttons.forEach(btn => {
  const text = btn.querySelector("span");

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  function start(x, y, e) {
    if (btn.classList.contains("editing")) return;

    dragging = true;

    const r = btn.getBoundingClientRect();
    offsetX = x - r.left;
    offsetY = y - r.top;

    if (e) e.preventDefault();
  }

  function move(x, y) {
    if (!dragging) return;

    const r = container.getBoundingClientRect();

    let px = x - r.left - offsetX;
    let py = y - r.top - offsetY;

    btn.style.left = (px / r.width) * 100 + "%";
    btn.style.top = (py / r.height) * 100 + "%";
  }

  function stop() {
    dragging = false;
  }

  // mouse
  btn.addEventListener("mousedown", e => start(e.clientX, e.clientY, e));
  document.addEventListener("mousemove", e => move(e.clientX, e.clientY));
  document.addEventListener("mouseup", stop);

  // touch
  btn.addEventListener("touchstart", e => {
    const t = e.touches[0];
    start(t.clientX, t.clientY, e);
  }, { passive: false });

  document.addEventListener("touchmove", e => {
    const t = e.touches[0];
    move(t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener("touchend", stop);

  /* ================= EDIT ================= */
  function edit() {
    btn.classList.add("editing");
    text.contentEditable = "true";
    text.focus();

    const range = document.createRange();
    const sel = window.getSelection();

    range.selectNodeContents(text);
    range.collapse(false);

    sel.removeAllRanges();
    sel.addRange(range);
  }

  function stopEdit() {
    btn.classList.remove("editing");
    text.contentEditable = "false";
  }

  btn.addEventListener("dblclick", edit);

  document.addEventListener("click", e => {
    if (!btn.contains(e.target)) stopEdit();
  });
});
</script>

</body>
</html>
