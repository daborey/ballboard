<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Portrait No Crop App</title>

<style>
body{
 margin:0;
 overflow:hidden;
 background:black;
}

/* START SCREEN */
#start{
 position:fixed;
 inset:0;
 display:flex;
 justify-content:center;
 align-items:center;
 background:black;
 color:white;
 z-index:9999;
}

/* FULLSCREEN BUTTON */
#fsBtn{
 position:fixed;
 right:15px;
 bottom:15px;
 width:55px;
 height:55px;
 border-radius:50%;
 border:none;
 background:#0008;
 color:white;
 z-index:9999;
}

/* CONTAINER */
#c{
 position:relative;
 width:100vw;
 height:100vh;
}

/* NO CROPPING IMAGE */
#bg{
 width:100%;
 height:100%;
 object-fit:contain;
 background:black;
}

/* BUTTONS */
.b{
 position:absolute;
 width:60px;
 height:60px;
 border-radius:50%;
 border:0;
 background:#4caf50;
 color:white;
 display:flex;
 justify-content:center;
 align-items:center;
 touch-action:none;
 user-select:none;
}

.b span{outline:none}
.edit{background:orange!important}
</style>
</head>

<body>

<div id="start">Tap to Start</div>
<button id="fsBtn">⛶</button>

<div id="c">

<img id="bg" src="bg.jpg">

<button class="b" style="top:10%;left:10%"><span>1</span></button>
<button class="b" style="top:10%;left:20%"><span>2</span></button>
<button class="b" style="top:20%;left:10%"><span>3</span></button>
<button class="b" style="top:20%;left:20%"><span>4</span></button>
<button class="b" style="top:30%;left:10%"><span>5</span></button>
<button class="b" style="top:30%;left:20%"><span>6</span></button>
<button class="b" style="top:40%;left:10%"><span>7</span></button>
<button class="b" style="top:40%;left:20%"><span>8</span></button>
<button class="b" style="top:50%;left:10%"><span>9</span></button>
<button class="b" style="top:50%;left:20%"><span>10</span></button>
<button class="b" style="top:60%;left:10%"><span>11</span></button>

</div>

<script>

/* START + FULLSCREEN */
start.onclick=()=>{
 start.remove()
 document.documentElement.requestFullscreen?.()
}

fsBtn.onclick=()=>{
 if(!document.fullscreenElement)
  document.documentElement.requestFullscreen()
 else
  document.exitFullscreen()
}

/* DRAG SYSTEM */
let drag=0,ox=0,oy=0

document.querySelectorAll(".b").forEach(b=>{
const t=b.querySelector("span")

b.ontouchstart=e=>{
if(b.classList.contains("edit"))return
let p=e.touches[0]
ox=p.clientX-b.offsetLeft
oy=p.clientY-b.offsetTop
drag=1
}

b.ontouchmove=e=>{
if(!drag)return
let p=e.touches[0],r=c.getBoundingClientRect()
b.style.left=(p.clientX-r.left-ox)/r.width*100+"%"
b.style.top=(p.clientY-r.top-oy)/r.height*100+"%"
}

b.ontouchend=()=>drag=0

/* DOUBLE TAP EDIT */
let last=0
b.onclick=()=>{
let now=Date.now()
if(now-last<300){
b.classList.add("edit")
t.contentEditable=true
t.focus()
}
last=now
}

/* EXIT EDIT */
document.addEventListener("click",e=>{
if(!b.contains(e.target)){
b.classList.remove("edit")
t.contentEditable=false
}
})

})
</script>

</body>
</html>
