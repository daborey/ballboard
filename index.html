<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Full Stable App</title>

<style>
body{
 margin:0;
 overflow:hidden;
 background:black;
}

#fsBtn{
 position:fixed;
 right:15px;
 bottom:15px;
 width:55px;
 height:55px;
 border-radius:50%;
 border:none;
 background:#0008;
 color:white;
 z-index:9999;
}

#c{
 position:relative;
 width:100vw;
 height:100vh;
}

#bg{
 width:100%;
 height:100%;
 object-fit:contain;
 background:black;
}

.b{
 position:absolute;
 width:60px;
 height:60px;
 border-radius:50%;
 border:0;
 background:#4caf50;
 color:white;
 display:flex;
 justify-content:center;
 align-items:center;
 touch-action:none;
 user-select:none;
}

.b span{outline:none}
.edit{background:orange!important}
</style>
</head>

<body>

<button id="fsBtn">⛶</button>

<div id="c">

<img id="bg" src="bg.jpg">

<button class="b" style="top:10%;left:10%"><span>1</span></button>
<button class="b" style="top:10%;left:20%"><span>2</span></button>
<button class="b" style="top:20%;left:10%"><span>3</span></button>
<button class="b" style="top:20%;left:20%"><span>4</span></button>
<button class="b" style="top:30%;left:10%"><span>5</span></button>
<button class="b" style="top:30%;left:20%"><span>6</span></button>
<button class="b" style="top:40%;left:10%"><span>7</span></button>
<button class="b" style="top:40%;left:20%"><span>8</span></button>
<button class="b" style="top:50%;left:10%"><span>9</span></button>
<button class="b" style="top:50%;left:20%"><span>10</span></button>
<button class="b" style="top:60%;left:10%"><span>11</span></button>

</div>

<script>

/* ===== FULLSCREEN ===== */
fsBtn.onclick=async()=>{
 if(!document.fullscreenElement)
  document.documentElement.requestFullscreen()
 else
  document.exitFullscreen()
}

/* ===== DRAG SYSTEM (MOUSE + TOUCH FIXED) ===== */
let drag=0,ox=0,oy=0

document.querySelectorAll(".b").forEach(b=>{
const t=b.querySelector("span")

function start(x,y){
 if(b.classList.contains("edit"))return
 ox=x-b.offsetLeft
 oy=y-b.offsetTop
 drag=1
}

function move(x,y){
 if(!drag)return
 let r=c.getBoundingClientRect()
 b.style.left=(x-r.left-ox)/r.width*100+"%"
 b.style.top=(y-r.top-oy)/r.height*100+"%"
}

function stop(){
 drag=0
}

/* TOUCH */
b.ontouchstart=e=>{
let p=e.touches[0]
start(p.clientX,p.clientY)
}

document.ontouchmove=e=>{
let p=e.touches[0]
move(p.clientX,p.clientY)
}

document.ontouchend=stop

/* MOUSE */
b.onmousedown=e=>start(e.clientX,e.clientY)

document.onmousemove=e=>move(e.clientX,e.clientY)

document.onmouseup=stop

/* ===== DOUBLE TAP / CLICK EDIT ===== */
let last=0

b.onclick=()=>{
let now=Date.now()

if(now-last<300){
 b.classList.add("edit")
 t.contentEditable=true
 t.focus()

 /* cursor FIX (go to end) */
 let range=document.createRange()
 range.selectNodeContents(t)
 range.collapse(false)

 let sel=window.getSelection()
 sel.removeAllRanges()
 sel.addRange(range)
}

last=now
}

/* EXIT EDIT */
document.addEventListener("click",e=>{
if(!b.contains(e.target)){
 b.classList.remove("edit")
 t.contentEditable=false
}
})

})
</script>

</body>
</html>
