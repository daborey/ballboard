<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fullscreen Stable UI Fix</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }

  /* ===== MAIN WRAPPER ===== */
  #container {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: black;
  }

  /* ===== IMAGE (NO CROP ALWAYS) ===== */
  #bg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ===== BUTTONS (IMPORTANT: ALWAYS ABOVE IMAGE) ===== */
  .dragBtn {
    position: absolute;
    z-index: 10; /* 🔥 keep above image */

    width: clamp(45px, 6vw, 80px);
    height: clamp(45px, 6vw, 80px);

    border-radius: 50%;
    border: none;

    background: #4CAF50;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    touch-action: none;
    user-select: none;
  }

  /* fullscreen button */
  #fsBtn {
    position: fixed;
    right: 15px;
    bottom: 15px;

    width: 55px;
    height: 55px;

    border-radius: 50%;
    border: none;

    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 20px;

    z-index: 99999;
  }
</style>
</head>

<body>

<div id="container">
  <img id="bg" src="bg.jpg">

  <!-- BUTTONS -->
  <button class="dragBtn" style="top:10%; left:10%;">1</button>
  <button class="dragBtn" style="top:10%; left:20%;">2</button>
  <button class="dragBtn" style="top:20%; left:10%;">3</button>
  <button class="dragBtn" style="top:20%; left:20%;">4</button>
  <button class="dragBtn" style="top:30%; left:10%;">5</button>
  <button class="dragBtn" style="top:30%; left:20%;">6</button>
  <button class="dragBtn" style="top:40%; left:10%;">7</button>
  <button class="dragBtn" style="top:40%; left:20%;">8</button>
  <button class="dragBtn" style="top:50%; left:10%;">9</button>
  <button class="dragBtn" style="top:50%; left:20%;">10</button>
  <button class="dragBtn" style="top:60%; left:10%;">11</button>
</div>

<button id="fsBtn">⛶</button>

<script>
const fsBtn = document.getElementById("fsBtn");
const container = document.getElementById("container");
const buttons = document.querySelectorAll(".dragBtn");

/* ===== FULLSCREEN SAFE ===== */
async function toggleFS() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (e) {}
}

fsBtn.addEventListener("click", toggleFS);

/* ===== DRAG FIX (WORKS IN FULLSCREEN) ===== */
buttons.forEach(btn => {
  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  btn.addEventListener("mousedown", start);
  btn.addEventListener("touchstart", start, {passive:false});

  function start(e) {
    dragging = true;

    const p = e.touches ? e.touches[0] : e;
    const r = btn.getBoundingClientRect();

    offsetX = p.clientX - r.left;
    offsetY = p.clientY - r.top;

    e.preventDefault();
  }

  document.addEventListener("mousemove", move);
  document.addEventListener("touchmove", move, {passive:false});

  function move(e) {
    if (!dragging) return;

    const p = e.touches ? e.touches[0] : e;
    const r = container.getBoundingClientRect();

    let x = p.clientX - r.left - offsetX;
    let y = p.clientY - r.top - offsetY;

    btn.style.left = (x / r.width) * 100 + "%";
    btn.style.top = (y / r.height) * 100 + "%";

    e.preventDefault();
  }

  document.addEventListener("mouseup", stop);
  document.addEventListener("touchend", stop);

  function stop() {
    dragging = false;
  }
});
</script>

</body>
</html>
